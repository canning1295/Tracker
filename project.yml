name: Tracker
options:
  bundleIdPrefix: com.toby
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "9"
    ENABLE_PREVIEWS: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 33596K443B
    TRACKER_IOS_BUNDLE_IDENTIFIER: com.toby.WorkoutTracker2026
targets:
  Tracker:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
      - path: Resources/Assets.xcassets
        buildPhase: resources
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
    dependencies:
      - target: TrackerWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TRACKER_IOS_BUNDLE_IDENTIFIER)
        INFOPLIST_FILE: iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/Tracker.entitlements
        PRODUCT_NAME: Tracker
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TrackerPhoneOnly:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
      - path: Resources/Assets.xcassets
        buildPhase: resources
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TRACKER_IOS_BUNDLE_IDENTIFIER).phoneonly
        INFOPLIST_FILE: iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/Tracker.entitlements
        PRODUCT_NAME: TrackerPhoneOnly
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TrackerWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: Watch
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: TrackerWatchWidgets
        embed: true
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TRACKER_IOS_BUNDLE_IDENTIFIER).watchkitapp
        INFOPLIST_FILE: Watch/Info.plist
        CODE_SIGN_ENTITLEMENTS: Watch/TrackerWatch.entitlements
        PRODUCT_NAME: TrackerWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TrackerWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TRACKER_IOS_BUNDLE_IDENTIFIER).watchkitapp.widgets
        INFOPLIST_FILE: WatchWidgets/Info.plist
        PRODUCT_NAME: TrackerWatchWidgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  TrackerCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Shared
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TRACKER_IOS_BUNDLE_IDENTIFIER).coretests
        PRODUCT_NAME: TrackerCoreTests
schemes:
  Tracker:
    build:
      targets:
        Tracker: all
        TrackerWatch: all
    run:
      config: Debug
    archive:
      config: Release
  TrackerPhoneOnly:
    build:
      targets:
        TrackerPhoneOnly: all
    run:
      config: Debug
    archive:
      config: Release
  TrackerWatch:
    build:
      targets:
        TrackerWatch: all
        TrackerWatchWidgets: all
    run:
      config: Debug
  TrackerCoreTests:
    build:
      targets:
        TrackerCoreTests: test
    test:
      targets:
        - TrackerCoreTests
